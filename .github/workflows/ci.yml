name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt
      - run: pip install -r requirements-prod.txt pytest pytest-asyncio pytest-xdist httpx
      - name: Unit tests (no live API or database)
        run: python -m pytest -q tests/test_booking_models.py tests/test_auth_security_controls.py tests/test_tscheck_production_config.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable && corepack prepare yarn@3.6.4 --activate
      - run: yarn install --immutable
      - run: yarn build
        env:
          DISABLE_VISUAL_EDITS: "true"
          DISABLE_EMERGENT_OVERLAY: "true"

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend
      - run: docker build --build-arg VITE_DEFAULT_TENANT_SLUG=ci ./frontend
