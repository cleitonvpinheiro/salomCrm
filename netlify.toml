[build]
  base = "frontend"
  command = "corepack yarn@4.18.1 install --immutable && corepack yarn@4.18.1 build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://34.68.59.216/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
